name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Package index to publish to
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require a matching release tag
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          assert project["name"] == "gesso-py"
          assert os.environ["GITHUB_REF_TYPE"] == "tag", "Select a release tag when running this workflow."
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag must match the package version."
          for path, field in [("gesso/__init__.py", "__version__"), ("docs/conf.py", "release")]:
              tree = ast.parse(Path(path).read_text())
              actual = next(ast.literal_eval(node.value) for node in tree.body
                            if isinstance(node, ast.Assign)
                            and any(isinstance(t, ast.Name) and t.id == field for t in node.targets))
              assert actual == version, f"Version mismatch in {path}"
          assert f"version: {version}" in Path("CITATION.cff").read_text().splitlines()
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check installed wheel outside the source tree
        env:
          MPLBACKEND: Agg
        run: |
          python -m pip install dist/*.whl
          python -I - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import gesso

          assert gesso.__version__ == version("gesso-py")
          assert "site-packages" in Path(gesso.__file__).parts
          assert callable(gesso.GESSO.from_anndata)
          assert callable(gesso.GeneSetActivityScoresReport.write_to_anndata)
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  tests:
    needs: build
    uses: ./.github/workflows/tests.yml

  publish:
    needs: [build, tests]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.repository }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
