[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[project]
name = "gesso-py"
version = "0.2.0"
description = "GESSO: spatially informed gene set activity analysis"
authors = [
    {name = "Andrew Yang", email = "andrew_j_yang@brown.edu"},
    {name = "Chichun Tan", email = "chichun_tan@brown.edu"},
    {name = "Ying Ma", email = "ying_ma@brown.edu"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "scipy>=1.16.1",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.6",
    "joblib>=1.5.3"
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["transcriptomics", "spatial", "pathway", "biostatistics", "statistics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

[project.optional-dependencies]
anndata = [
    "anndata>=0.12.3"
]
tutorial = [
    "anndata>=0.12.3",
    "scanpy>=1.12",
    "squidpy>=1.8",
    "ipykernel>=6.30",
    "ipywidgets>=8.1.7",
    "nbclient>=0.10.2"
]
test = [
    "pytest>=8.4.2"
]


[project.urls]
Homepage = "https://github.com/YMa-Lab/GESSO"
Documentation = "https://gesso-malab.readthedocs.io/"
Source = "https://github.com/YMa-lab/GESSO"
Issues = "https://github.com/YMa-lab/GESSO/issues"
Changelog = "https://gesso-malab.readthedocs.io/en/latest/changelog.html"



[tool.hatch.build.targets.wheel]
packages = ["gesso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
